# GetExternalServices collects useful summary information for configured
# external services. Note that config automatically redacts secrets.
query GetExternalServices {
    externalServices {
        nodes {
            kind
            id
            displayName

            config
            createdAt
            updatedAt

            repoCount

            lastSyncAt
            lastSyncError
            nextSyncAt

            checkConnection {
                __typename
                ... on ExternalServiceAvailable {
                    lastCheckedAt
                }
                ... on ExternalServiceUnavailable {
                    suspectedReason
                }
                ... on ExternalServiceAvailabilityUnknown {
                    implementationNote
                }
            }
        }
    }
}

mutation UpdateExternalService($id: ID!, $displayName: String!, $config: String!) {
   updateExternalService(input: {id: $id, displayName: $displayName, config: $config}) {
        kind
        id
        displayName
        config
        createdAt
        updatedAt
   }
}

mutation CreateCodeIntelligenceConfigurationPolicy(
    $name: String!
    $gitObjectType: GitObjectType!
    $pattern: String!
    $retentionEnabled: Boolean = false
    $retentionDurationHours: Int
    $retainIntermediateCommits: Boolean = false
    $indexingEnabled: Boolean = true
    $indexCommitMaxAgeHours: Int
    $indexIntermediateCommits: Boolean = false
) {
    createCodeIntelligenceConfigurationPolicy(
        name: $name
        type: $gitObjectType
        pattern: $pattern
        retentionEnabled: $retentionEnabled
        retentionDurationHours: $retentionDurationHours
        retainIntermediateCommits: $retainIntermediateCommits
        indexingEnabled: $indexingEnabled
        indexCommitMaxAgeHours: $indexCommitMaxAgeHours
        indexIntermediateCommits: $indexIntermediateCommits
    ) {
        __typename
    }
}

query GetCodeIntelligenceConfigurationPolicies {
    codeIntelligenceConfigurationPolicies {
        nodes {
            ...CodeIntelligenceConfigurationPolicyFields
        }
    }
}

fragment CodeIntelligenceConfigurationPolicyFields on CodeIntelligenceConfigurationPolicy {
    id
    name
    repositoryPatterns
    type
    pattern
    protected
    retentionEnabled
    retentionDurationHours
    retainIntermediateCommits
    indexingEnabled
    indexCommitMaxAgeHours
    indexIntermediateCommits
    embeddingsEnabled
}
